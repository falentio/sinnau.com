# fly.toml app configuration file generated for sinnau-com-production on 2026-07-31T00:38:12+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sinnau-com-production'
primary_region = 'sin'

[deploy]
strategy = 'immediate'

[env]
BETTER_AUTH_ALLOWED_HOSTS = 'sinnau.com'
BODY_SIZE_LIMIT = '50M'
ENVIRONMENT = 'production'
NODE_ENV = 'production'
PORT = '11085'

[[mounts]]
source = 'data'
destination = '/app/data'

[http_service]
internal_port = 11085
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
